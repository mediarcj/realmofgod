# File: pnpm-workspace.yaml
# Description: Defines the small package workspace and approved dependency build scripts.
# Purpose: Keeps the sanctuary bundle isolated while limiting install-time executable code.
# Notes: New packages or lifecycle-script approvals require an intentional dependency review.

# Keep each future browser security boundary in its own application package.
packages:
  - apps/*

# Refuse unsupported runtimes, implicit peers, and unreviewed lifecycle scripts.
engineStrict: true
saveExact: true
autoInstallPeers: false
strictPeerDependencies: true
strictDepBuilds: true

# Keep the verified content-addressable store local and recheck its package content.
storeDir: .pnpm-store
verifyStoreIntegrity: true

# Hold ordinary new releases for one day; these exact current Worker pins were reviewed together.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  - "@cloudflare/vite-plugin@1.52.1"
  - miniflare@5.20260811.1-alpha
  - wrangler@4.123.0

# Keep the exact glTF Transform CLI while replacing its vulnerable Sharp range with the patched line.
overrides:
  "@gltf-transform/cli>sharp": 0.35.2

# Permit only reviewed native tools used by the application and offline asset pipeline.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
